[project]
name = "chordsense"
version = "0.1.0"
description = "ChordSense Pro — DE/AI Backend"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "audiomentations>=0.36.0",
    "yt-dlp>=2024.11.18",
    "demucs>=4.0.0",
]
db = [
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "motor>=3.6.0",
    "redis>=5.2.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]
ai = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.47.0",
    "peft>=0.14.0",
    "mlflow>=2.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
