# ─────────────────────────────────────────────────────────────
# ChordSensePro DE — Docker Compose
#
# Services:
#   postgres       → App database (crawl_queue, training_samples; song_analyses etc. parked)
#   postgres_meta  → Airflow metadata database (separate for safety)
#   mongo          → Raw audio staging (raw_audio_jobs — pointers to temp WAVs)
#   redis          → Celery broker (future) + cache
#   airflow        → Pipeline orchestrator (standalone = webserver + scheduler), GPU for Demucs
#
# Usage:
#   docker compose up -d          # start all
#   docker compose logs -f airflow  # watch DAG execution
#   docker compose down -v        # tear down + delete volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── App PostgreSQL — song_analyses, chord_attempts, user_chord_mastery ──
  postgres:
    image: postgres:16-alpine
    container_name: chordsense_postgres
    environment:
      POSTGRES_DB: chordsense
      POSTGRES_USER: chordsense
      POSTGRES_PASSWORD: chordsense_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # auto-create tables on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chordsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Metadata PostgreSQL — separate from app DB ──────────────────
  postgres_meta:
    image: postgres:16-alpine
    container_name: chordsense_airflow_meta
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_dev
    volumes:
      - postgres_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB — raw audio metadata & blob refs ────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: chordsense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — Celery broker (future) + caching ────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: chordsense_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow (standalone = webserver + scheduler in one) ──────────────────
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chordsense_airflow
    depends_on:
      postgres:
        condition: service_healthy
      postgres_meta:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Airflow core ──
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      # ── Airflow metadata DB (separate from app DB) ──
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev@postgres_meta:5432/airflow

      # ── Airflow auto-setup ──
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

      # ── App settings (read by src/shared/infrastructure/settings/config.py) ──
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: chordsense
      POSTGRES_USER: chordsense
      POSTGRES_PASSWORD: chordsense_dev
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: chordsense_raw
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_LEVEL: INFO
      DATA_DIR: /data

      # ── Training ETL (see markdown/change_log.md) ──
      TRAINING_DIR: /data/training          # clean labeled segments (.npy) — bind-mounted below
      INGEST_BATCH_SIZE: "100"              # URLs per DAG run (every 2 h); 20 → 50 → 100 for Hooktheory clips
      DEMUCS_SEGMENT: "6"                   # seconds per Demucs chunk — keeps a 4 GB GPU from OOM
      ALIGN_TOLERANCE_SEC: "3.0"            # JAAH: max |audio - annotation| duration
      YTDLP_COOKIES: /etc/chordsense/cookies.txt   # optional; used only if the file exists
    ports:
      - "8080:8080"
    # NVIDIA GPU for Demucs (needs NVIDIA driver + Docker Desktop WSL2 GPU support).
    # No GPU? delete this block — the pipeline falls back to CPU automatically (much slower).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./dags:/opt/airflow/dags           # hot-reload DAGs during dev
      - ./src:/opt/airflow/src             # hot-reload source during dev
      - ./scripts:/opt/airflow/scripts     # seed / reset / export scripts
      - ./data/datasets:/data/datasets     # local datasets (read-only)
      - ./data/training:/data/training     # OUTPUT: training audio (.npy) — visible on the host
      - ./data/export:/data/export         # OUTPUT: exported train/val/test files for Colab
      - ./config:/etc/chordsense           # optional config/cookies.txt for yt-dlp
      - chordsense_data:/data              # persistent audio working dir
    command: bash -c "mkdir -p /data/tmp && chmod 777 /data/tmp || true && airflow standalone"

volumes:
  postgres_data:
  postgres_meta_data:
  mongo_data:
  chordsense_data:
